# Stage 3c / experiments 1 + 2 together
#
# Only worth running once the two single-factor runs above have each been read
# out, otherwise an effect cannot be attributed to either one.  Kept as a file
# so the combination is exactly the two deltas and nothing else.
#
# Resumes from stage3b weights with a fresh short cosine schedule.  The dataset
# mixture is stage3b's with every sample count divided by 10, so the
# proportions are identical and an epoch is ~73k samples instead of ~729k: a
# same-day signal rather than a week.  To run it at full fidelity, copy the
# train_dataset block back from config/recurrent_stage3b.yaml.
#
# Read out with, in order:
#   python tools/ab/extract_multi.py --repo . --model_path <ckpt> \
#       --out_dir $AB/recon --prefix <label> --seqs $AB/ab_seqs/* examples/002
#   python tools/ab/exp_repeat.py $AB/recon --seqs rep_002_01_x8 \
#       --models cut3r=CUT3R loop3b=stage3b <label>=<label>
#   python tools/ab/exp_pairs.py  $AB/recon --seq 002 --ref cut3r --cmp <label>
#   bash   tools/ab/run_baseline_eval.sh      # LOOP_CKPT=<ckpt> LOOP_LABEL=<label>
#
# The number to beat, from docs/defect_diagnosis.md: stage3b moves an identical
# frame's points by 9.3% of median depth at the first state update and 18.4% by
# step 7, against CUT3R's 1.0%.  GHOST on 002 is 0.0602 against 0.0216.

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='none', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, num_blocks=3, num_steps=8, use_tbptl=True, tbptl_warmup=6, tbptl_thinking=1, tbptl_grad_steps=2, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=3, dec_num_steps_img=4, dec_num_blocks_state=3, dec_num_steps_state=4, dec_use_tbptl=False, dec_t_scale=True))"

pretrained: checkpoints/recurrent_stage3b/checkpoints/checkpoint-final.pth
load_only_encoder: False
resume: null
auto_resume: True

recurrent_ckpt: null
recurrent_block_index: 0
recurrent_strict: False
encoder_only_training: False

# Loss Configuration
train_criterion: "ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: False
fixed_length: True
benchmark: True

num_views: 4
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

# Dataset paths — all confirmed working (paths from Stage 2)
co3d_root:            /app/recurrentTransformer/dataset/disk14tb/processed_co3d
wildrgbd_root:        /app/recurrentTransformer/dataset/disk14tb/preprocess_wildrgbd
arkit_root:           /app/recurrentTransformer/fastdatasets/processed_arkitscenes
