# Attribution experiment, arm 'attr_loop_cut3rdec' (generated from recurrent_stage3b.yaml).
# LoopCUT3R architecture (3 shared decoder blocks x 4) with decoder, heads, pose memory and
# state tokens initialised from CUT3R (decoder blocks 0,4,8); encoder from phase 3b.
# All three arms: same data (10% of the phase-3b mixture per epoch), 3 epochs,
# LR 1e-5 -> 1e-6, encoder TBPTL unchanged.  Judge only with the benchmarks.
# Build the init checkpoints with experiments/scripts/init_from_cut3r.py.

# Recurrent Stage 3b — LR-restart extension of Stage 3 (Phase 3)
#
# Resumes from Stage 3 final weights (checkpoint-final.pth, weights-only)
# with a fresh cosine LR schedule at lr=5e-6 for 15 epochs.
#
# Key differences from recurrent_stage3.yaml:
#   - pretrained: points to stage3 checkpoint-final.pth (not stage2)
#   - auto_resume: True → optimizer state resets (intentional — clean LR restart)
#   - lr: 5e-6 (half of original; model is already converged, want refinement)
#   - min_lr: 5e-7 (proportionally scaled)
#   - warmup_epochs: 1 (model is stable, no need for long warmup)
#   - epochs: 15
#   - exp_name: recurrent_stage3b (separate output directory)
#
# Everything else (model arch, dataset mix, batch size, resolutions) is identical
# to recurrent_stage3.yaml.

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='none', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, num_blocks=3, num_steps=8, use_tbptl=True, tbptl_warmup=6, tbptl_thinking=1, tbptl_grad_steps=2, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=3, dec_num_steps_img=4, dec_num_blocks_state=3, dec_num_steps_state=4, dec_use_tbptl=False))"

pretrained: checkpoints/init_shared.pth
load_only_encoder: False
resume: null
auto_resume: True

recurrent_ckpt: null
recurrent_block_index: 0
recurrent_strict: False
encoder_only_training: False

# Loss Configuration
train_criterion: "ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: False
fixed_length: True
benchmark: True

num_views: 4
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

# Dataset paths — all confirmed working (paths from Stage 2)
# Root of the preprocessed training data (docs/preprocess.md).
# Set LOOPCUT3R_DATA or edit this line.
data_root: ${oc.env:LOOPCUT3R_DATA,data/train}
co3d_root:            ${data_root}/processed_co3d
wildrgbd_root:        ${data_root}/preprocess_wildrgbd
arkit_root:           ${data_root}/processed_arkitscenes
arkit_highres_root:   ${data_root}/processed_arkitscenes_highres
scannetpp_root:       ${data_root}/processed_scannetpp
scannet_root:         ${data_root}/processed_scannet
hypersim_root:        ${data_root}/processed_hypersim
blended_mvs_root:     ${data_root}/processed_BlendedMVS1_full
megadepth_root:       ${data_root}/processed_megadepth
mapfree_root:         ${data_root}/processed_mapfree
waymo_root:           ${data_root}/waymo_processed
vkitti_root:          ${data_root}/vkitti_2.0.3_mixed
unreal4k_root:        ${data_root}/processed_unrealStereo4k
tartanair_root:       ${data_root}/processed_TartanAir
dl3dv_root:           ${data_root}/processed_dl3dv
cop3d_root:           ${data_root}/processed_cop3d
mvimgnet_root:        ${data_root}/processed_mvimgnet
re10k_root:           ${data_root}/processed_re10k
omniobject3d_root:    ${data_root}/processed_omniobject3d
threedkb_root:        ${data_root}/processed_3dkb
irs_root:             ${data_root}/processed_irs
synscapes_root:       ${data_root}/processed_synscapes
urbansyn_root:        ${data_root}/processed_urbansyn
eden_root:            ${data_root}/processed_eden
dynamic_replica_root: ${data_root}/processed_dynamic_replica
spring_root:          ${data_root}/processed_spring
bedlam_root:          ${data_root}/processed_bedlam
mvs_synth_root:       ${data_root}/processed_mvs_synth
point_odyssey_root:   ${data_root}/processed_point_odyssey
uasol_root:           ${data_root}/processed_uasol
mp3d_root:            ${data_root}/processed_mp3d
hoi4d_root:           ${data_root}/processed_hoi4d

# Multi-Resolution aspect ratio list
resolution:
  - [512, 384]
  - [512, 336]
  - [512, 288]
  - [512, 256]
  - [512, 208]
  - [512, 144]
  - [384, 512]
  - [336, 512]
  - [288, 512]
  - [256, 512]

