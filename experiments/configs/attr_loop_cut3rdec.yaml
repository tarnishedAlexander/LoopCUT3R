dataset31: MP3D_Multi(allow_repeat=True, split=None, ROOT='${mp3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset33: HOI4D_Multi(allow_repeat=True, split=None, ROOT='${hoi4d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

# Training dataset mixture — sample counts match CUT3R stage3 exactly.
# dataset19 (OmniObject3D) and dataset24 (EDEN) are defined above but excluded here,
# matching CUT3R's own stage3.yaml which defines but never samples these two.
# Total: ~729k samples/epoch × 15 epochs = ~10.9M sample-passes.
train_dataset: >
  4480 @ ${dataset1}
  + 5600 @ ${dataset2}
  + 5600 @ ${dataset3}
  + 2240 @ ${dataset4}
  + 1680 @ ${dataset5}
  + 3840 @ ${dataset6}
  + 1120 @ ${dataset7}
  + 2240 @ ${dataset8}
  + 2240 @ ${dataset9}
  + 8400 @ ${dataset10}
  + 2000 @ ${dataset11}
  + 560 @ ${dataset12}
  + 17 @ ${dataset13}
  + 5600 @ ${dataset14}
  + 7400 @ ${dataset15}
  + 48 @ ${dataset16}
  + 1920 @ ${dataset17}
  + 480 @ ${dataset18}
  + 480 @ ${dataset20}
  + 240 @ ${dataset21}
  + 240 @ ${dataset22}
  + 60 @ ${dataset23}
  + 3600 @ ${dataset25}
  + 3600 @ ${dataset26}
  + 940 @ ${dataset27}
  + 140 @ ${dataset28}
  + 720 @ ${dataset29}
  + 1440 @ ${dataset30}
  + 2880 @ ${dataset31}
  + 1200 @ ${dataset33}

# Test Dataset definition
test_dataset: 1000 @ ARKitScenes_Multi(split='train', ROOT='${arkit_root}', resolution=224, num_views=${num_test_views}, seed=42, n_corres=${n_corres_test})

seed: 0
batch_size: 4
accum_iter: 4
gradient_checkpointing: True
epochs: 3
start_epoch: 0
weight_decay: 0.05
lr: 1.0e-5
min_lr: 1.0e-6
warmup_epochs: 0.3

amp: 0
mixed_precision: 'bf16'
clip_grad: 0.1

num_workers: 8
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 1
save_freq: 1
keep_freq: 1
print_freq: 50
print_img_freq: 500
num_imgs_vis: 4

save_dir: 'checkpoints'
exp_name: 'attr_loop_cut3rdec'
task: 'cut3r'
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/

hydra:
  verbose: True
  run:
    dir: ./${save_dir}/${exp_name}
