# stage3f: adaptacion REAL a la posicion del encoder (enc_rope=True)
#
# QUE PREGUNTA CONTESTA
# --------------------
# stage3d ya probo esto y salio NEGATIVO (seccion 1c), pero con una escala que
# resulto ser diminuta cuando se midio:
#
#   stage3d    2 epocas x  62.605 muestras =   125.000 muestras,  lr 1e-6
#   stage3b   12 epocas x 710.048 muestras = 8.520.000 muestras,  lr 5e-6
#
# stage3d fue el 1,5% del computo de stage3b a un quinto del learning rate. Asi
# que "la adaptacion barata no arregla el atractor" esta medido, pero solo para
# un empujon muy pequeno. Esta corrida es UNA epoca de la mezcla COMPLETA de
# stage3b al lr de stage3b: 11x el computo de stage3d y 5x el lr.
#
# UNA SOLA VARIABLE
# -----------------
# Identico a recurrent_stage3b.yaml salvo: enc_rope=True en el modelo, los pesos
# de partida ya remapeados al layout con rope, 1 epoca, sin warmup. NO lleva
# duplicate_first_view ni RepeatConsistencyLoss (eso fue stage3e, negativo) ni
# priming (eso es inferencia). Si esta corrida mueve algo, el unico candidato es
# la adaptacion a la posicion.
#
# COMO SE JUZGA
# -------------
# Por el BENCHMARK, no por la sonda. La leccion de la seccion 5d es que `resid`,
# GHOST y `cam_rot` miden autoconsistencia y no predicen la exactitud: las tres
# palancas gratis mejoraban la sonda y ninguna mejoro el benchmark. Al terminar:
#
#   bash tools/ab/bench_config.sh      (editando el ckpt y la config)
#   python tools/ab/relpose_table.py scannet LoopCUT3R_stage3b_rerun <nuevo> CUT3R_fixed
#
# A batir, stage3b sin tocar: scannet RPE_rot 54.807 / ATE 0.8895,
# tum 42.693 / 0.7798, sintel 2.891 / 0.2368, profundidad sintel 0.5808,
# bonn 0.1104. CUT3R correcto: 3.016 / 0.1690, 7.840 / 0.1448, 0.687 / 0.2482,
# 0.4563, 0.0531.
#
# COSTE
# -----
# ~35 h (177.512 pasos a batch 4, medido: stage3b tardo 1 dia 10 h por epoca).
#
# DISCO
# -----
# Con keep_freq 0 escribe -last (4,3 GB), -best (4,3 GB) y -final (1,4 GB, state
# dict desnudo): unos 10 GB, mas el transitorio de una escritura. Comprobar que
# hay sitio ANTES de lanzar: hoy un checkpoint-final quedo TRUNCADO escribiendose
# con el disco al limite, y no dio ningun error.
#
# Ver docs/attractor_mechanism.md secciones 1b (el bug), 1c (stage3d) y 5d (por
# que se juzga con el benchmark).

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='none', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, num_blocks=3, num_steps=8, use_tbptl=True, tbptl_warmup=6, tbptl_thinking=1, tbptl_grad_steps=2, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=3, dec_num_steps_img=4, dec_num_blocks_state=3, dec_num_steps_state=4, dec_use_tbptl=False, enc_rope=True))"

pretrained: checkpoints/loop3b_encrope_init.pth   # stage3b con la atencion del
                                                 # encoder remapeada al layout
                                                 # con rope (renombrado exacto,
                                                 # tools/ab/remap_enc_attn.py)
load_only_encoder: False
resume: null
auto_resume: True

recurrent_ckpt: null
recurrent_block_index: 0
recurrent_strict: False
encoder_only_training: False

# Loss Configuration
train_criterion: "ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: False
fixed_length: True
benchmark: True

