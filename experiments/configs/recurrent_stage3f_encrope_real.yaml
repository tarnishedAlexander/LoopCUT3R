epochs: 1
start_epoch: 0
weight_decay: 0.05
lr: 5.0e-6
min_lr: 5.0e-7
warmup_epochs: 0   # los pesos ya estan entrenados; esto es adaptacion

amp: 0
mixed_precision: 'bf16'
clip_grad: 0.1

num_workers: 8
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 1
save_freq: 1
keep_freq: 0   # con UNA epoca el checkpoint numerado seria identico a
               # checkpoint-last (src/train.py:649 solo lo escribe si
               # keep_freq != 0). Ahorra 4,3 GB y no pierde nada.
print_freq: 50
print_img_freq: 500
num_imgs_vis: 4

save_dir: 'checkpoints'
exp_name: 'recurrent_stage3f_encrope_real'
