# Training dataset mixture — sample counts match CUT3R stage3 exactly.
# dataset19 (OmniObject3D) and dataset24 (EDEN) are defined above but excluded here,
# matching CUT3R's own stage3.yaml which defines but never samples these two.
# Total: ~729k samples/epoch × 15 epochs = ~10.9M sample-passes.
train_dataset: >
  44800 @ ${dataset1}
  + 56000 @ ${dataset2}
  + 56000 @ ${dataset3}
  + 22400 @ ${dataset4}
  + 16800 @ ${dataset5}
  + 38400 @ ${dataset6}
  + 11200 @ ${dataset7}
  + 22400 @ ${dataset8}
  + 22400 @ ${dataset9}
  + 84000 @ ${dataset10}
  + 20000 @ ${dataset11}
  + 5600  @ ${dataset12}
  + 168   @ ${dataset13}
  + 56000 @ ${dataset14}
  + 74000 @ ${dataset15}
  + 480   @ ${dataset16}
  + 19200 @ ${dataset17}
  + 4800  @ ${dataset18}
  + 4800  @ ${dataset20}
  + 2400  @ ${dataset21}
  + 2400  @ ${dataset22}
  + 600   @ ${dataset23}
  + 36000 @ ${dataset25}
  + 36000 @ ${dataset26}
  + 9400  @ ${dataset27}
  + 1400  @ ${dataset28}
  + 7200  @ ${dataset29}
  + 14400 @ ${dataset30}
  + 28800 @ ${dataset31}
  + 12000 @ ${dataset33}

# Test Dataset definition
test_dataset: 1000 @ ARKitScenes_Multi(split='train', ROOT='${arkit_root}', resolution=224, num_views=${num_test_views}, seed=42, n_corres=${n_corres_test})

