# Full CUT3R training with a native recurrent backbone initialized from RAPTOR pretraining.
# Trains both ENCODER and DECODER on a mix of datasets.

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='none', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, img_size=(96, 96), head_type='linear', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=512, dec_depth=8, dec_num_heads=16, num_blocks=3, num_steps=8, use_tbptl=True, tbptl_warmup=2, tbptl_thinking=1, tbptl_grad_steps=4, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5))"

pretrained: null
load_only_encoder: False
resume: null

# Phase 3 Raptor composed model used as encoder initialization.
# Set RAPTOR_RECURRENT_CKPT env var to override, or update the default path below.
recurrent_ckpt: ${oc.env:RAPTOR_RECURRENT_CKPT,/app/recurrentTransformer/raptor1/src/phase3_models/raptor_latest.pt}
recurrent_block_index: 0
recurrent_strict: True

# Full-model training (encoder+decoder)
encoder_only_training: False

# Loss configuration for 3D perception
train_criterion: ConfLoss(Regr3DPose(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)
test_criterion: Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0)

long_context: False
fixed_length: True
benchmark: True

num_views: 2
num_test_views: 2
n_corres_train: 0
n_corres_test: 0

# Dataset paths (relative to src/)
mvs_root: ../../dataset/distill_croco/processed_mvs_synth/
vkitti_root: ../../dataset/vkitti_2.0.3_mixed
tartanair_root: ../../raptor/data/tartanair_data

dataset1: MVS_Synth_Multi(allow_repeat=True, split='train', ROOT='${mvs_root}', aug_crop=8, resolution=96, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset2: VirtualKITTI2_Multi(allow_repeat=True, split='train', ROOT='${vkitti_root}', aug_crop=8, resolution=96, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
# Combining all datasets
train_dataset: 3000 @ ${dataset1} + 3000 @ ${dataset2}
test_dataset: 40 @ ${dataset1} + 40 @ ${dataset2}

seed: 0
batch_size: 2
accum_iter: 16
gradient_checkpointing: True
epochs: 100
start_epoch: 0
weight_decay: 0.05
lr: 5e-5
min_lr: 1e-6
warmup_epochs: 1
amp: 1
mixed_precision: fp16
optimizer: sgd
momentum: 0.9
nesterov: True
foreach: False
force_cpu: False

num_workers: 8
eval_freq: 5
save_freq: 1
keep_freq: 10
print_freq: 5
print_img_freq: 1000
num_imgs_vis: 2
save_dir: 'checkpoints'
exp_name: 'raptor_full_finetune_1024_48h'
task: 'cut3r'
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/

hydra:
  verbose: True
  run:
    dir: ./${save_dir}/${exp_name}
