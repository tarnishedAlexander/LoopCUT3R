# DL3DV excluded: H5VFS nested-dir structure yields 0 valid scenes at num_views=64.

# Training dataset mixture (actual yield may be lower for short-sequence datasets due to allow_repeat=False + 64 views)
train_dataset: 22400 @ ${dataset1} + 28000 @ ${dataset2} + 2800 @ ${dataset3} + 2800 @ ${dataset4} + 2800 @ ${dataset5} + 11200 @ ${dataset6} + 2800 @ ${dataset7} + 11200 @ ${dataset8} + 8400 @ ${dataset9} + 28000 @ ${dataset10} + 21000 @ ${dataset11} + 2800 @ ${dataset12} + 2800 @ ${dataset13} + 28000 @ ${dataset14} + 12000 @ ${dataset15} + 16800 @ ${dataset16} + 1200 @ ${dataset17} + 4800 @ ${dataset18} + 7200 @ ${dataset19} + 9600 @ ${dataset20} + 3600 @ ${dataset21} + 9600 @ ${dataset22} + 4800 @ ${dataset23} + 2800 @ ${dataset24} + 84 @ ${dataset25} + 14400 @ ${dataset26}

# Test Dataset definition
test_dataset: 1000 @ ARKitScenes_Multi(split='train', ROOT='${arkit_root}', resolution=224, num_views=${num_test_views}, seed=42, n_corres=${n_corres_test})

