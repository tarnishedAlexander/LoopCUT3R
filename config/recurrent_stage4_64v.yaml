# Recurrent Stage 4 — 64-view long-context fine-tuning (512px, freeze=encoder)
#
# Extends the 32-view version to double the temporal context window.
# Forces the recurrent state to maintain coherence across 64-frame sequences.
#
# Memory: batch_size reduced to 2 (half of 32v) because each forward pass is 2× longer.
#   accum_iter=8 to keep effective batch=16.
#   gradient_checkpointing=True required (decoder runs 64×4=256 recurrent steps).
#
# allow_repeat=False: only sequences with ≥64 frames contribute.
#   Datasets like BlendedMVS and MapFree will yield fewer samples than the 32v run
#   (short sequences skipped), but this is intentional — genuine 64-frame context only.
#   Long-sequence datasets (ScanNet, Waymo, TartanAir, ARKit, DL3DV) are unaffected.
#
# Pretrained from Stage 3b ep12, same as 32v.
# Run AFTER the 32v stage (or in parallel as a separate experiment for comparison).
#
# Checkpoints go to checkpoints/recurrent_stage4_64v/.
# Move old checkpoints to disk14tb when disk fills (keep_freq=2, 4GB each → ~8GB/2 epochs).

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, num_blocks=3, num_steps=8, use_tbptl=False, tbptl_warmup=6, tbptl_thinking=1, tbptl_grad_steps=2, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=3, dec_num_steps_img=4, dec_num_blocks_state=3, dec_num_steps_state=4, dec_use_tbptl=False))"

pretrained: checkpoints/recurrent_stage3b/checkpoints/checkpoint-final.pth
load_only_encoder: False
resume: null
auto_resume: True

recurrent_ckpt: null
recurrent_block_index: 0
recurrent_strict: False
encoder_only_training: False

# Loss Configuration
train_criterion: "ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: True
fixed_length: True
benchmark: True

# Long Context Sequence parameters
num_views: 64
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

# Absolute paths within the container to verified preprocessed datasets
co3d_root: /app/recurrentTransformer/dataset/datasetfaster/processed_co3d
arkit_root: /app/recurrentTransformer/fastdatasets/processed_arkitscenes
arkit_highres_root: /app/recurrentTransformer/fastdatasets/processed_arkitscenes_highres
scannetpp_root: /app/recurrentTransformer/dataset/datasetfaster/processed_scannetpp
scannet_root: /app/recurrentTransformer/dataset/diskPool/processed_scannet
blended_mvs1_root: /app/recurrentTransformer/dataset/datasetfaster/processed_BlendedMVS1_full
blended_mvs2_root: /app/recurrentTransformer/dataset/datasetfaster/processed_BlendedMVS2_full
megadepth_root: /app/recurrentTransformer/dataset/datasetfaster/processed_megadepth
mapfree_root: /app/recurrentTransformer/dataset/datasetfaster/processed_mapfree
waymo_root: /app/recurrentTransformer/fastdatasets/waymo_processed
vkitti_root: /app/recurrentTransformer/dataset/datasetfaster/vkitti_2.0.3_mixed
tartanair_root: /app/recurrentTransformer/dataset/diskPool/processed_TartanAir
mvs_synth_root: /app/recurrentTransformer/fastdatasets/processed_mvs_synth
wildrgbd_root: /app/recurrentTransformer/dataset/disk14tb/preprocess_wildrgbd
omniobject3d_root: /app/recurrentTransformer/dataset/disk14tb/processed_omniobject3d
dynamic_replica_root: /app/recurrentTransformer/dataset/disk14tb/processed_dynamic_replica
spring_root: /app/recurrentTransformer/dataset/disk12tb/processed_spring
bedlam_root: /app/recurrentTransformer/dataset/disk12tb/processed_bedlam
uasol_root: /app/recurrentTransformer/dataset/disk14tb/processed_uasol
mp3d_root: /app/recurrentTransformer/dataset/disk14tb/matterport3d/processed_mp3d
cop3d_root: /app/recurrentTransformer/dataset/disk12tb/processed/processed_cop3d
mvimgnet_root: /app/recurrentTransformer/dataset/disk12tb/processed/processed_mvimgnet
re10k_root: /app/recurrentTransformer/dataset/disk12tb/processed/processed_re10k
hypersim_root: /app/recurrentTransformer/dataset/diskPool/processed_hypersim
unreal4k_root: /app/recurrentTransformer/dataset/disk12tb/processed/processed_unrealStereo4k
point_odyssey_root: /app/recurrentTransformer/dataset/diskPool/processed_point_odyssey
dl3dv_root: /app/recurrentTransformer/dataset/disk12tb/processed_dl3dv

# Multi-Resolution aspect ratio list
resolution:
  - [512, 384]
  - [512, 336]
  - [512, 288]
  - [512, 256]
  - [512, 208]
  - [512, 144]
  - [384, 512]
  - [336, 512]
  - [288, 512]
  - [256, 512]

# Dataset Definitions — allow_repeat=False: only sequences with ≥64 frames contribute
dataset1: Co3d_Multi(allow_repeat=False, split='train', ROOT='${co3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset2: ARKitScenes_Multi(allow_repeat=False, split='train', ROOT='${arkit_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset3: ScanNetpp_Multi(allow_repeat=False, split='train', ROOT='${scannetpp_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset4: ScanNet_Multi(allow_repeat=False, split='train', ROOT='${scannet_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset5: BlendedMVS_Multi(allow_repeat=False, split='train', ROOT='${blended_mvs1_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset6: BlendedMVS_Multi(allow_repeat=False, split='train', ROOT='${blended_mvs2_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset7: MegaDepth_Multi(allow_repeat=False, split='train', ROOT='${megadepth_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset8: MapFree_Multi(allow_repeat=False, split=None, ROOT='${mapfree_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset9: Waymo_Multi(allow_repeat=False, split=None, ROOT='${waymo_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset10: VirtualKITTI2_Multi(allow_repeat=False, split=None, ROOT='${vkitti_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
