dataset12: MVS_Synth_Multi(allow_repeat=False, split='train', ROOT='${mvs_synth_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset13: ARKitScenesHighRes_Multi(allow_repeat=False, split='train', ROOT='${arkit_highres_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset14: WildRGBD_Multi(allow_repeat=False, split='train', ROOT='${wildrgbd_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset15: OmniObject3D_Multi(allow_repeat=False, split=None, ROOT='${omniobject3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset16: DynamicReplica(allow_repeat=False, split='train', ROOT='${dynamic_replica_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset17: Spring(allow_repeat=False, split=None, ROOT='${spring_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset18: BEDLAM_Multi(allow_repeat=False, split='train', ROOT='${bedlam_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset19: UASOL_Multi(allow_repeat=False, split='train', ROOT='${uasol_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset20: MP3D_Multi(allow_repeat=False, split=None, ROOT='${mp3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset21: Cop3D_Multi(allow_repeat=False, split='train', ROOT='${cop3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset22: MVImgNet_Multi(allow_repeat=False, split='train', ROOT='${mvimgnet_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset23: RE10K_Multi(allow_repeat=False, split=None, ROOT='${re10k_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset24: HyperSim_Multi(allow_repeat=False, split='train', ROOT='${hypersim_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset25: UnReal4K_Multi(allow_repeat=False, split=None, ROOT='${unreal4k_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
