# Recurrent Stage 4 — Variable-length long-context fine-tuning (512px, freeze=encoder)
#
# Mirrors CUT3R's dpt_512_vary_4_64.yaml exactly, but with:
#   - LoopCUT3R recurrent architecture (num_blocks=3, num_steps=8, TBPTL params, etc.)
#   - Our local dataset paths
#   - BlendedMVS2 added (extra dataset not in original CUT3R)
#   - DL3DV excluded (H5VFS nested-dir structure yields 0 valid scenes at num_views=64)
#   - SmartPortraits excluded (not available on disk)
#
# Key difference from recurrent_stage4_32v / 64v:
#   fixed_length: False  → each training example is a random-length sequence [4, 64]
#   allow_repeat: True   → short sequences allowed (frames repeated to reach num_views)
#   num_views: 64        → maximum context window
#
# This variable-length training makes the model generalize to any sequence length at
# inference, rather than only being robust at exactly 32 or 64 frames. This is how
# the released CUT3R checkpoint achieves clean results on arbitrary-length videos.
#
# Dataset sample counts match CUT3R's vary config exactly where datasets overlap.
# Epochs: 10 (matching CUT3R).
#
# Pretrained from stage3b checkpoint-final.pth.
# Checkpoints → checkpoints/recurrent_stage4_vary/

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, num_blocks=3, num_steps=8, use_tbptl=False, tbptl_warmup=6, tbptl_thinking=1, tbptl_grad_steps=2, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=3, dec_num_steps_img=4, dec_num_blocks_state=3, dec_num_steps_state=4, dec_use_tbptl=False))"

pretrained: checkpoints/recurrent_stage3b/checkpoints/checkpoint-final.pth
load_only_encoder: False
resume: null
auto_resume: True

recurrent_ckpt: null
recurrent_block_index: 0
recurrent_strict: False
encoder_only_training: False

# Loss Configuration
train_criterion: "ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: True
fixed_length: False   # variable-length sequences [4, num_views] — key difference from 32v/64v
benchmark: False      # CUT3R disables benchmark during vary training (batch shapes vary)

num_views: 64         # maximum context window; actual per-batch length sampled in [4, 64]
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

# Dataset paths
co3d_root:            /app/recurrentTransformer/dataset/datasetfaster/processed_co3d
wildrgbd_root:        /app/recurrentTransformer/dataset/disk14tb/preprocess_wildrgbd
arkit_root:           /app/recurrentTransformer/fastdatasets/processed_arkitscenes
arkit_highres_root:   /app/recurrentTransformer/fastdatasets/processed_arkitscenes_highres
scannetpp_root:       /app/recurrentTransformer/dataset/datasetfaster/processed_scannetpp
scannet_root:         /app/recurrentTransformer/dataset/diskPool/processed_scannet
hypersim_root:        /app/recurrentTransformer/dataset/diskPool/processed_hypersim
blended_mvs1_root:    /app/recurrentTransformer/dataset/datasetfaster/processed_BlendedMVS1_full
blended_mvs2_root:    /app/recurrentTransformer/dataset/datasetfaster/processed_BlendedMVS2_full
megadepth_root:       /app/recurrentTransformer/dataset/datasetfaster/processed_megadepth
mapfree_root:         /app/recurrentTransformer/dataset/datasetfaster/processed_mapfree
waymo_root:           /app/recurrentTransformer/fastdatasets/waymo_processed
vkitti_root:          /app/recurrentTransformer/dataset/datasetfaster/vkitti_2.0.3_mixed
unreal4k_root:        /app/recurrentTransformer/dataset/disk12tb/processed/processed_unrealStereo4k
tartanair_root:       /app/recurrentTransformer/dataset/diskPool/processed_TartanAir
cop3d_root:           /app/recurrentTransformer/dataset/disk12tb/processed/processed_cop3d
mvimgnet_root:        /app/recurrentTransformer/dataset/disk12tb/processed/processed_mvimgnet
re10k_root:           /app/recurrentTransformer/dataset/disk12tb/processed/processed_re10k
omniobject3d_root:    /app/recurrentTransformer/dataset/disk14tb/processed_omniobject3d
dynamic_replica_root: /app/recurrentTransformer/dataset/disk14tb/processed_dynamic_replica
spring_root:          /app/recurrentTransformer/dataset/disk12tb/processed_spring
bedlam_root:          /app/recurrentTransformer/dataset/disk12tb/processed_bedlam
mvs_synth_root:       /app/recurrentTransformer/fastdatasets/processed_mvs_synth
point_odyssey_root:   /app/recurrentTransformer/dataset/diskPool/processed_point_odyssey
uasol_root:           /app/recurrentTransformer/dataset/disk14tb/processed_uasol
mp3d_root:            /app/recurrentTransformer/dataset/disk14tb/matterport3d/processed_mp3d

# Multi-Resolution aspect ratio list (matches CUT3R vary config exactly)
resolution:
  - [512, 384]
  - [512, 336]
  - [512, 288]
  - [512, 256]
  - [512, 208]
  - [512, 144]
  - [384, 512]
  - [336, 512]
  - [288, 512]
  - [256, 512]

# Dataset definitions — allow_repeat=True so all datasets contribute regardless of length
# Numbers match CUT3R's vary config exactly
dataset1:  Co3d_Multi(allow_repeat=True, split='train', ROOT='${co3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset2:  WildRGBD_Multi(allow_repeat=True, split='train', ROOT='${wildrgbd_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset3:  ARKitScenes_Multi(allow_repeat=True, split='train', ROOT='${arkit_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset4:  ARKitScenesHighRes_Multi(allow_repeat=True, split='train', ROOT='${arkit_highres_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset5:  ScanNetpp_Multi(allow_repeat=True, split='train', ROOT='${scannetpp_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset6:  ScanNet_Multi(allow_repeat=True, split='train', ROOT='${scannet_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset7:  HyperSim_Multi(allow_repeat=True, split='train', ROOT='${hypersim_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset8:  BlendedMVS_Multi(allow_repeat=True, split='train', ROOT='${blended_mvs1_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset8b: BlendedMVS_Multi(allow_repeat=True, split='train', ROOT='${blended_mvs2_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset9:  MegaDepth_Multi(allow_repeat=True, split='train', ROOT='${megadepth_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset10: MapFree_Multi(allow_repeat=True, split=None, ROOT='${mapfree_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset11: Waymo_Multi(allow_repeat=True, split=None, ROOT='${waymo_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset12: VirtualKITTI2_Multi(allow_repeat=True, split=None, ROOT='${vkitti_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset13: UnReal4K_Multi(allow_repeat=True, split=None, ROOT='${unreal4k_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset14: TartanAir_Multi(allow_repeat=True, split=None, ROOT='${tartanair_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
# dataset15: DL3DV excluded — H5VFS nested-dir structure yields 0 valid scenes at num_views=64
dataset16: Cop3D_Multi(allow_repeat=True, split='train', ROOT='${cop3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset17: MVImgNet_Multi(allow_repeat=True, split='train', ROOT='${mvimgnet_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset18: RE10K_Multi(allow_repeat=True, split=None, ROOT='${re10k_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset19: OmniObject3D_Multi(allow_repeat=True, split=None, ROOT='${omniobject3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset26: DynamicReplica(allow_repeat=True, split='train', ROOT='${dynamic_replica_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset27: Spring(allow_repeat=True, split=None, ROOT='${spring_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset28: BEDLAM_Multi(allow_repeat=True, split='train', ROOT='${bedlam_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset29: MVS_Synth_Multi(allow_repeat=True, split='train', ROOT='${mvs_synth_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset30: PointOdyssey_Multi(allow_repeat=True, split='train', ROOT='${point_odyssey_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset31: UASOL_Multi(allow_repeat=True, split='train', ROOT='${uasol_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset32: MP3D_Multi(allow_repeat=True, split=None, ROOT='${mp3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

# Sample counts match CUT3R dpt_512_vary_4_64.yaml exactly (datasets 1-14, 16-19, 26-32).
# BlendedMVS2 (dataset8b) added with same count as BlendedMVS1.
# DL3DV (84000 in CUT3R) excluded — loss partially offset by BlendedMVS2 (22400).
# Total: ~756k samples/epoch × 10 epochs = ~7.56M sample-passes
train_dataset: >
  44800  @ ${dataset1}
  + 56000  @ ${dataset2}
  + 56000  @ ${dataset3}
  + 22400  @ ${dataset4}
  + 16800  @ ${dataset5}
  + 22400  @ ${dataset6}
  + 11200  @ ${dataset7}
  + 22400  @ ${dataset8}
  + 22400  @ ${dataset8b}
  + 22400  @ ${dataset9}
  + 84000  @ ${dataset10}
  + 56000  @ ${dataset11}
  + 5600   @ ${dataset12}
  + 168    @ ${dataset13}
  + 56000  @ ${dataset14}
  + 480    @ ${dataset16}
  + 19200  @ ${dataset17}
  + 4800   @ ${dataset18}
  + 38400  @ ${dataset19}
  + 26400  @ ${dataset26}
  + 1200   @ ${dataset27}
  + 36000  @ ${dataset28}
  + 2400   @ ${dataset29}
  + 24000  @ ${dataset30}
  + 14400  @ ${dataset31}
  + 28800  @ ${dataset32}

# Test Dataset definition
test_dataset: 1000 @ ARKitScenes_Multi(split='train', ROOT='${arkit_root}', resolution=224, num_views=${num_test_views}, seed=42, n_corres=${n_corres_test})

seed: 0
batch_size: 4
accum_iter: 4
gradient_checkpointing: True
epochs: 10
start_epoch: 0
weight_decay: 0.05
lr: 1.0e-6
min_lr: 1.0e-7
warmup_epochs: 0.5

amp: 0
mixed_precision: 'bf16'
clip_grad: 0.3

num_workers: 4
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 1
save_freq: 1
keep_freq: 2
print_freq: 50
print_img_freq: 500
num_imgs_vis: 4

save_dir: 'checkpoints'
exp_name: 'recurrent_stage4_vary'
task: 'cut3r'
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/

hydra:
  verbose: False
  run:
    dir: ./${save_dir}/${exp_name}
