# Recurrent Stage 4 Sequence Fine-Tuning Config (512px, freeze=encoder, 32 views)
#
# Fixes vs original recurrent_stage4:
#   - dec_use_tbptl=False: same 0-grad-steps bug (decoder would not train at all)
#   - gradient_checkpointing=True: was False; 32-view sequences at 512px WILL OOM without it
#     (even with frozen encoder, decoder runs 32×4=128 recurrent steps needing grad)
#   - epochs=2: 1 epoch inadequate for recurrent model to learn 32-view temporal context
#   - num_workers=8: was 14 (unnecessary on single GPU)
#
# Encoder TBPTL params are irrelevant here (freeze='encoder' means no encoder grad),
# but kept identical to stage3 for checkpoint compatibility.

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, num_blocks=3, num_steps=8, use_tbptl=True, tbptl_warmup=6, tbptl_thinking=1, tbptl_grad_steps=2, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=3, dec_num_steps_img=4, dec_num_blocks_state=3, dec_num_steps_state=4, dec_use_tbptl=False))"

pretrained: checkpoints/recurrent_stage3b/checkpoints/checkpoint-final.pth
load_only_encoder: False
resume: null
auto_resume: True

recurrent_ckpt: null
recurrent_block_index: 0
recurrent_strict: False
encoder_only_training: False

# Loss Configuration
train_criterion: "ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: True
fixed_length: True
benchmark: True

# Long Context Sequence parameter
num_views: 32
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

# Absolute paths within the container to verified preprocessed datasets
co3d_root: /app/recurrentTransformer/dataset/diskPool/processed_co3d
arkit_root: /app/recurrentTransformer/fastdatasets/processed_arkitscenes
scannetpp_root: /app/recurrentTransformer/dataset/disk12tb/processed_scannetpp
scannet_root: /app/recurrentTransformer/dataset/diskPool/processed_scannet
blended_mvs1_root: /app/recurrentTransformer/dataset/diskPool/processed_BlendedMVS1_full
blended_mvs2_root: /app/recurrentTransformer/dataset/diskPool/processed_BlendedMVS2_full
megadepth_root: /app/recurrentTransformer/dataset/diskPool/processed_megadepth
mapfree_root: /app/recurrentTransformer/dataset/disk12tb/Mapfreedataset/processed_mapfree
waymo_root: /app/recurrentTransformer/fastdatasets/waymo_processed
vkitti_root: /app/recurrentTransformer/dataset/disk12tb/vkitti_2.0.3_mixed
tartanair_root: /app/recurrentTransformer/dataset/diskPool/processed_TartanAir
mvs_synth_root: /app/recurrentTransformer/processed_mvs_synth
dl3dv_root: /app/recurrentTransformer/dataset/disk12tb/dl3dv/processed_dl3dv

# Multi-Resolution aspect ratio list
resolution:
  - [512, 384]
  - [512, 336]
  - [512, 288]
  - [512, 256]
  - [512, 208]
  - [512, 144]
  - [384, 512]
  - [336, 512]
  - [288, 512]
  - [256, 512]

# Individual Dataset Definitions supporting multi-resolution without repeat
dataset1: Co3d_Multi(allow_repeat=False, split='train', ROOT='${co3d_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset2: ARKitScenes_Multi(allow_repeat=False, split='train', ROOT='${arkit_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset3: ScanNetpp_Multi(allow_repeat=False, split='train', ROOT='${scannetpp_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset4: ScanNet_Multi(allow_repeat=False, split='train', ROOT='${scannet_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset5: BlendedMVS_Multi(allow_repeat=False, split='train', ROOT='${blended_mvs1_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset6: BlendedMVS_Multi(allow_repeat=False, split='train', ROOT='${blended_mvs2_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset7: MegaDepth_Multi(allow_repeat=False, split='train', ROOT='${megadepth_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset8: MapFree_Multi(allow_repeat=False, split=None, ROOT='${mapfree_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset9: Waymo_Multi(allow_repeat=False, split=None, ROOT='${waymo_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset10: VirtualKITTI2_Multi(allow_repeat=False, split=None, ROOT='${vkitti_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset11: TartanAir_Multi(allow_repeat=False, split=None, ROOT='${tartanair_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset12: MVS_Synth_Multi(allow_repeat=False, split='train', ROOT='${mvs_synth_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset13: DL3DV_Multi(allow_repeat=False, split='train', ROOT='${dl3dv_root}', aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

# Training dataset mixture
train_dataset: 22400 @ ${dataset1} + 28000 @ ${dataset2} + 2800 @ ${dataset3} + 2800 @ ${dataset4} + 2800 @ ${dataset5} + 70000 @ ${dataset6} + 2800 @ ${dataset7} + 11200 @ ${dataset8} + 8400 @ ${dataset9} + 28000 @ ${dataset10} + 21000 @ ${dataset11} + 2800 @ ${dataset12} + 14000 @ ${dataset13}


# Test Dataset definition
test_dataset: 1000 @ ARKitScenes_Multi(split='train', ROOT='${arkit_root}', resolution=224, num_views=${num_test_views}, seed=42, n_corres=${n_corres_test})

seed: 0
batch_size: 4
accum_iter: 4
gradient_checkpointing: True
epochs: 5
start_epoch: 0
weight_decay: 0.05
lr: 1.0e-6
min_lr: 1.0e-7
warmup_epochs: 0.5

amp: 0
mixed_precision: 'bf16'
clip_grad: 0.3

num_workers: 8
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 1
save_freq: 1
keep_freq: 2
print_freq: 50
print_img_freq: 500
num_imgs_vis: 4

save_dir: 'checkpoints'
exp_name: 'recurrent_stage4'
task: 'cut3r'
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/

hydra:
  verbose: True
  run:
    dir: ./${save_dir}/${exp_name}
