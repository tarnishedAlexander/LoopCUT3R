# Recurrent Stage 3 Fine-Tuning Config (512px multi-AR, DPT head)
#
# Fixes vs original recurrent_stage3:
#   - dec_use_tbptl=False: same 0-grad-steps bug as stage1 (warmup=3,thinking=1,grad_steps=1
#     → grad_start=max(3,4)=4=total → decoder never trained)
#   - gradient_checkpointing already True: but was disabled by dec_use_tbptl=True in model.py
#   - num_workers=8: was 14 (no benefit beyond 8 on single GPU)
#
# Encoder TBPTL kept (warmup=6,thinking=1,grad_steps=2 → 1/8 steps):
#   High-res adaptation at lr=1e-5 — encoder should be stable, minimal perturbation.
#
# Dataset mix: 32 CUT3R stage3 datasets (30 active in training).
#   OmniObject3D and EDEN defined but excluded from train_dataset (matching CUT3R's own config).
#   SmartPortraits excluded: data not present on disk.
#   HOI4D re-added: preprocessed from video (15fps→3fps stride=5, 178K frames, 2973 scenes).
#   Paths verified from Stage 2 training.

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='none', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, num_blocks=3, num_steps=8, use_tbptl=True, tbptl_warmup=6, tbptl_thinking=1, tbptl_grad_steps=2, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=3, dec_num_steps_img=4, dec_num_blocks_state=3, dec_num_steps_state=4, dec_use_tbptl=False))"

pretrained: checkpoints/recurrent_stage2/checkpoints/checkpoint-final.pth
load_only_encoder: False
resume: null
auto_resume: True

recurrent_ckpt: null
recurrent_block_index: 0
recurrent_strict: False
encoder_only_training: False

# Loss Configuration
train_criterion: "ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: False
fixed_length: True
benchmark: True

num_views: 4
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

