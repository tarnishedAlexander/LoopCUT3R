# Smoke config for new recurrent-over-depth decoder implementation.
# Keeps dims/head/resolution unchanged and only changes decoder depth-sharing.

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=576, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, img_size=(96, 96), head_type='linear', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=768, enc_depth=12, enc_num_heads=12, dec_embed_dim=512, dec_depth=8, dec_num_heads=16, num_blocks=1, num_steps=8, use_tbptl=True, tbptl_warmup=2, tbptl_thinking=1, tbptl_grad_steps=4, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=4, dec_num_steps_img=8, dec_num_blocks_state=3, dec_num_steps_state=8, dec_use_tbptl=True, dec_tbptl_warmup=2, dec_tbptl_thinking=1, dec_tbptl_grad_steps=4))"

pretrained: /app/recurrentTransformer/CUT3R_encoder/src/checkpoints/decoder_cka_finetune_v1/checkpoints/checkpoint-last.pth
load_only_encoder: False
resume: null
auto_resume: False

encoder_only_training: False
train_criterion: "ConfLoss(Regr3DPose(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: False
fixed_length: True
benchmark: False

num_views: 2
num_test_views: 2
n_corres_train: 0
n_corres_test: 0

data_root: ${oc.env:CUT3R_DATA_ROOT,/app/recurrentTransformer/dataset}
dataset1: MVS_Synth_Multi(allow_repeat=True, split='train', ROOT='${data_root}/processed_mvs_synth', aug_crop=8, resolution=96, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
dataset2: VirtualKITTI2_Multi(allow_repeat=True, split='train', ROOT='${data_root}/vkitti_2.0.3_mixed', aug_crop=8, resolution=96, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
train_dataset: 3000 @ ${dataset1} + 3000 @ ${dataset2}

test_dataset1: 80 @ MVS_Synth_Multi(allow_repeat=False, split='train', ROOT='${data_root}/processed_mvs_synth', aug_crop=8, resolution=96, transform=SeqColorJitter, num_views=${num_test_views}, n_corres=${n_corres_test}, seed=42)
test_dataset2: 80 @ VirtualKITTI2_Multi(allow_repeat=False, split='train', ROOT='${data_root}/vkitti_2.0.3_mixed', aug_crop=8, resolution=96, transform=SeqColorJitter, num_views=${num_test_views}, n_corres=${n_corres_test}, seed=42)
test_dataset: ${test_dataset1} + ${test_dataset2}

seed: 0
batch_size: 1
accum_iter: 8
gradient_checkpointing: True
epochs: 2

start_epoch: 0
weight_decay: 0.05
lr: 1e-5
min_lr: 1e-6
warmup_epochs: 0.5
amp: 1
mixed_precision: fp16
optimizer: adamw
force_cpu: False

num_workers: 1
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 1
save_freq: 1
keep_freq: 1
print_freq: 20
print_img_freq: 50000000
num_imgs_vis: 2
save_dir: 'checkpoints'
exp_name: 'decoder_recurrent_k43_smoke'
task: 'cut3r'
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/

hydra:
  verbose: True
  run:
    dir: ./${save_dir}/${exp_name}
