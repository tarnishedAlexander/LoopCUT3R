# Recurrent Stage 2 Fine-Tuning Config (224x224, 31 datasets)
#
# Fixes vs original recurrent_stage2:
#   - dec_use_tbptl=False: original had warmup=3,thinking=1,grad_steps=1 →
#     grad_start=max(3,4)=4=total → 0 decoder grad steps (same bug as stage1 ep0-9)
#   - gradient_checkpointing=True: dec_use_tbptl=False enables it in model.py
#   - mixed_precision='bf16': was 'no' (slower, no benefit)
#   - epochs=4: original 2 is too few; model needs to absorb 16 new datasets
#   - accum_iter=4: effective batch 32, consistent with r3
#   - num_workers=8: was 0 (cripples data loading)
#   - pretrained → r3 checkpoint (not broken original stage1)
#
# Encoder TBPTL kept as-is (warmup=6,thinking=1,grad_steps=2 → 1/8 steps):
#   Fine-tuning at lr=5e-6 needs stable encoder — 1 grad step is appropriate.

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='none', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, img_size=(224, 224), head_type='linear', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, num_blocks=3, num_steps=8, use_tbptl=True, tbptl_warmup=6, tbptl_thinking=1, tbptl_grad_steps=2, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5, dec_num_blocks_img=3, dec_num_steps_img=4, dec_num_blocks_state=3, dec_num_steps_state=4, dec_use_tbptl=False))"

pretrained: checkpoints/recurrent_stage1_r3/checkpoints/checkpoint-final.pth
load_only_encoder: False
resume: null
auto_resume: True

recurrent_ckpt: null
recurrent_block_index: 0
recurrent_strict: False
encoder_only_training: False

# Loss Configuration
train_criterion: "ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)"
test_criterion: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

long_context: False
fixed_length: True
benchmark: True

num_views: 4
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

