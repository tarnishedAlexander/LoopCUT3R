# Encoder-only CUT3R training with a native recurrent backbone initialized from RAPTOR pretraining.
# This is not a wrapper setup: recurrent block weights are loaded directly into CUT3R encoder blocks.

model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='decoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, img_size=(128, 128), head_type='linear', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=512, dec_depth=8, dec_num_heads=16, num_blocks=3, num_steps=8, use_tbptl=True, tbptl_warmup=2, tbptl_thinking=1, tbptl_grad_steps=4, recurrent_t_scale=False, recurrent_swiglu=False, ls_init=1e-5))"

pretrained: null
load_only_encoder: False
resume: null
auto_resume: False

# Native recurrent backbone initialization
recurrent_ckpt: ${oc.env:RAPTOR_RECURRENT_CKPT,/app/recurrentTransformer/raptor1/src/runs/models/final_cut3r_2day_robust_abcschedule_teacher_name_cut3r_encoder_thresholds_2-5_weighted_False_autoregressive_False_distillation_False_teacher_True_mse_True_cosine_True_t_scale_False_swiglu_False_sigma_0.001_sta_7a4805b946}
recurrent_block_index: 0
recurrent_strict: True

encoder_only_training: True
encoder_geo_aux_weight: 0.05
encoder_geo_aux_decay: 2.0
encoder_geo_aux_trans_weight: 1.0
encoder_geo_aux_rot_weight: 0.25
encoder_geo_aux_weighting: inverse
encoder_geo_aux_min_pair_weight: 0.05
encoder_train_criterion: "EncoderFeatureConsistencyLoss(temporal_weight=1.0, variance_weight=0.1, min_std=0.05) + ${encoder_geo_aux_weight}*EncoderPoseWeightedTemporalLoss(decay=${encoder_geo_aux_decay}, trans_weight=${encoder_geo_aux_trans_weight}, rot_weight=${encoder_geo_aux_rot_weight}, weighting='${encoder_geo_aux_weighting}', min_pair_weight=${encoder_geo_aux_min_pair_weight})"
encoder_test_criterion: "EncoderFeatureConsistencyLoss(temporal_weight=1.0, variance_weight=0.1, min_std=0.05) + ${encoder_geo_aux_weight}*EncoderPoseWeightedTemporalLoss(decay=${encoder_geo_aux_decay}, trans_weight=${encoder_geo_aux_trans_weight}, rot_weight=${encoder_geo_aux_rot_weight}, weighting='${encoder_geo_aux_weighting}', min_pair_weight=${encoder_geo_aux_min_pair_weight})"

# kept for compatibility
train_criterion: ConfLoss(Regr3DPose(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)
test_criterion: Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0)

long_context: False
fixed_length: True
benchmark: True

num_views: 3
num_test_views: 3
n_corres_train: 0
n_corres_test: 0

data_root: ${oc.env:CUT3R_DATA_ROOT,../../dataset/distill_croco}
dataset1: MVS_Synth_Multi(allow_repeat=True, split='train', ROOT='${data_root}/processed_mvs_synth', aug_crop=16, resolution=128, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})
train_dataset: 8000 @ ${dataset1}

test_dataset: 60 @ MVS_Synth_Multi(allow_repeat=False, split='train', ROOT='${data_root}/processed_mvs_synth', aug_crop=16, resolution=128, transform=SeqColorJitter, num_views=${num_test_views}, n_corres=${n_corres_test}, seed=42)

seed: 0
batch_size: 1
accum_iter: 32
gradient_checkpointing: True
epochs: 6
start_epoch: 0
weight_decay: 0.05
lr: 5e-5
min_lr: 1e-6
warmup_epochs: 0.2
amp: 1
mixed_precision: fp16
optimizer: sgd
momentum: 0.0
nesterov: False
foreach: False
force_cpu: False

num_workers: 2
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 1
save_freq: 1
keep_freq: 5
print_freq: 10
print_img_freq: 50000000
num_imgs_vis: 4
save_dir: 'checkpoints'
exp_name: 'encoder_only_raptor_backbone'
task: 'cut3r'
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/

hydra:
  verbose: True
  run:
    dir: ./${save_dir}/${exp_name}
